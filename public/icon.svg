<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="sproutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#022c22" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background with rounded squircle for Android -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />

  <!-- Inner glowing circle ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#34d399" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="16 12" />

  <!-- Agricultural Crop Emblem inside 80% Safe Zone -->
  <g filter="url(#shadow)" transform="translate(0, -10)">
    <!-- Rice stalk curves / Golden Harvest Ear -->
    <path d="M256 390 C256 390 256 220 256 160 C256 120 280 80 320 70 C310 110 290 140 270 170 C260 185 258 240 256 390 Z" fill="url(#leafGrad)" />
    
    <!-- Left Sprout Leaf -->
    <path d="M254 310 C200 300 130 250 120 180 C180 180 230 220 254 280 Z" fill="url(#sproutGrad)" />

    <!-- Right Sprout Leaf -->
    <path d="M258 270 C310 250 370 200 380 130 C320 140 280 180 258 240 Z" fill="url(#sproutGrad)" />

    <!-- Left secondary leaf -->
    <path d="M254 360 C180 370 140 330 140 290 C180 290 220 320 254 340 Z" fill="#4ade80" />

    <!-- Golden Rice Grains -->
    <ellipse cx="280" cy="115" rx="18" ry="9" transform="rotate(-35 280 115)" fill="#fef08a" />
    <ellipse cx="305" cy="85" rx="16" ry="8" transform="rotate(-45 305 85)" fill="#fde047" />
    <ellipse cx="250" cy="135" rx="18" ry="9" transform="rotate(35 250 135)" fill="#fef08a" />
    <ellipse cx="230" cy="105" rx="16" ry="8" transform="rotate(45 230 105)" fill="#fde047" />

    <!-- Base Soil Mound / Furrows -->
    <path d="M150 410 C180 395 220 390 256 390 C292 390 332 395 362 410 C340 430 300 440 256 440 C212 440 172 430 150 410 Z" fill="#14532d" />
  </g>

  <!-- Bengali Agro Text "সাদেকুল এগ্রো" subtle curve banner -->
  <rect x="136" y="420" width="240" height="42" rx="21" fill="#022c22" fill-opacity="0.6" />
  <text x="256" y="448" font-family="'Hind Siliguri', 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="bold" fill="#fef08a" text-anchor="middle" letter-spacing="1">সাদেকুল এগ্রো</text>
</svg>
